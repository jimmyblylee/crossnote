<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Callout 语法测试（浏览器）</title>
  <!-- 引入 markdown-it -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@13.0.1/dist/markdown-it.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      color: #333;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
    }
    
    h1 {
      border-bottom: 1px solid #eaecef;
      padding-bottom: 0.3em;
    }
    
    /* Callout 样式 */
    /* Callout styles */
    .callout {
      box-shadow: 0 2px 2px 0 rgba(0, 0, 0, .14), 0 1px 5px 0 rgba(0, 0, 0, .12), 0 3px 1px -2px rgba(0, 0, 0, .2);
      position: relative;
      margin: 1.5625em 0;
      padding: 0 1.2rem;
      border-left: .4rem solid rgba(68, 138, 255, .8);
      border-radius: .2rem;
      background-color: rgba(255, 255, 255, 0.05);
      overflow: auto;
    }

    .callout > p {
      margin-top: .8rem;
    }

    .callout > .callout-title {
      margin: 0 -1.2rem;
      padding: .8rem 1.2rem .8rem 3.6rem;
      border-bottom: 1px solid rgba(68, 138, 255, .2);
      background-color: rgba(68, 138, 255, .1);
      font-weight: 700;
    }

    .callout > .callout-title:before {
      position: absolute;
      left: 1.2rem;
      font-size: 1.5rem;
      color: rgba(68, 138, 255, .8);
      content: "info";
      font-family: "Material Icons";
      font-style: normal;
      font-variant: normal;
    }

    /* 不同类型的 callout */
    .callout.callout-note {
      border-left-color: #448aff;
    }
    .callout.callout-note > .callout-title {
      background-color: rgba(68, 138, 255, .1);
    }
    .callout.callout-note > .callout-title:before {
      color: #448aff;
      content: "info";
    }

    .callout.callout-tip {
      border-left-color: #00bfa5;
    }
    .callout.callout-tip > .callout-title {
      background-color: rgba(0, 191, 165, .1);
    }
    .callout.callout-tip > .callout-title:before {
      color: #00bfa5;
      content: "lightbulb";
    }

    .callout.callout-warning {
      border-left-color: #ff9100;
    }
    .callout.callout-warning > .callout-title {
      background-color: rgba(255, 145, 0, .1);
    }
    .callout.callout-warning > .callout-title:before {
      color: #ff9100;
      content: "warning";
    }

    .callout.callout-danger {
      border-left-color: #ff5252;
    }
    .callout.callout-danger > .callout-title {
      background-color: rgba(255, 82, 82, .1);
    }
    .callout.callout-danger > .callout-title:before {
      color: #ff5252;
      content: "error";
    }
    
    pre {
      background-color: #f6f8fa;
      border-radius: 3px;
      padding: 16px;
      overflow: auto;
    }
    
    code {
      font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      background-color: #f6f8fa;
      padding: 0.2em 0.4em;
      border-radius: 3px;
    }
    
    pre code {
      background-color: transparent;
      padding: 0;
    }
    
    #editor {
      width: 100%;
      height: 300px;
      border: 1px solid #ccc;
      padding: 10px;
      font-family: monospace;
      margin-bottom: 20px;
    }
    
    button {
      padding: 8px 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    
    button:hover {
      background-color: #45a049;
    }
  </style>
  <!-- Material Icons 字体 -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <h1>Callout 语法测试（浏览器）</h1>
  
  <p>在下面的编辑框中编辑 Markdown 文本，然后点击"渲染"按钮来测试 Callout 语法。</p>
  
  <textarea id="editor"># Callout 语法测试

这是普通文本段落。

> [!NOTE] 笔记标题
> 这是一个笔记内容，使用 Callout 语法。
> 可以包含多行内容。

> [!TIP] 提示标题
> 这是一个提示信息。
> - 可以包含列表
> - 多行内容

> [!WARNING] 警告标题
> 这是一个警告信息。

> [!IMPORTANT] 重要信息
> 这是一个重要信息。

> [!CAUTION] 注意事项
> 这是一个需要注意的事项。

普通文本继续。

> 这是普通的引用块，没有使用 Callout 语法。

> [!INFO] 
> 这是没有标题的 Callout，将会使用默认标题。

> [!EXAMPLE]
> ```javascript
> // 可以在 Callout 中包含代码块
> function hello() {
>   console.log("Hello, world!");
> }
> ```</textarea>
  
  <button onclick="renderMarkdown()">渲染</button>
  
  <div id="result"></div>
  
  <script>
    // 初始化 markdown-it
    const md = window.markdownit({
      html: true,       // 启用 HTML 标签
      breaks: true,     // 将换行符转换为 <br>
      linkify: true,    // 将 URL 转换为链接
      typographer: true // 启用一些语言中性的替换和引号
    });
    
    // 添加 callout 插件
    function addCalloutPlugin(md) {
      const CALLOUT_REGEX = /^\s*>\s*\[!([\w]+)\](?:\s+(.+))?/;
      
      // 存储原始的 blockquote 渲染器
      const defaultRender = md.renderer.rules.blockquote_open || function(tokens, idx, options, env, self) {
        return self.renderToken(tokens, idx, options);
      };
      
      // 修改 blockquote 的渲染方式
      md.renderer.rules.blockquote_open = function(tokens, idx, options, env, self) {
        const token = tokens[idx];
        const content = tokens[idx + 1].content;
        
        // 检查第一行是否匹配 callout 语法
        const firstLine = content.split('\n')[0] || '';
        const match = CALLOUT_REGEX.exec(firstLine);
        
        if (match) {
          const type = match[1].toLowerCase();
          const title = match[2] || type.toUpperCase();
          
          // 为 token 添加类
          token.attrJoin('class', 'callout');
          token.attrJoin('class', `callout-${type}`);
          
          // 在 blockquote 内插入 callout 标题
          const htmlTitle = `<div class="callout-title">${title}</div>`;
          
          // 替换原始内容中的第一行，移除 callout 标记
          const contentWithoutFirstLine = content.replace(firstLine, htmlTitle);
          tokens[idx + 1].content = contentWithoutFirstLine;
        }
        
        return defaultRender(tokens, idx, options, env, self);
      };
    }
    
    // 应用 callout 插件
    addCalloutPlugin(md);
    
    // 渲染 Markdown
    function renderMarkdown() {
      const editorContent = document.getElementById('editor').value;
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = md.render(editorContent);
    }
    
    // 初始渲染
    renderMarkdown();
  </script>
</body>
</html>
