<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Callout 语法测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        h1 {
            border-bottom: 1px solid #eaecef;
            padding-bottom: 0.3em;
        }
        
        /* 这里引入 callout 样式 */
        /* Callout styles */
        .callout {
            box-shadow: 0 2px 2px 0 rgba(0, 0, 0, .14), 0 1px 5px 0 rgba(0, 0, 0, .12), 0 3px 1px -2px rgba(0, 0, 0, .2);
            position: relative;
            margin: 1.5625em 0;
            padding: 0 1.2rem;
            border-left: .4rem solid rgba(68, 138, 255, .8);
            border-radius: .2rem;
            background-color: rgba(255, 255, 255, 0.05);
            overflow: auto;
        }

        .callout > p {
            margin-top: .8rem;
        }

        .callout > .callout-title {
            margin: 0 -1.2rem;
            padding: .8rem 1.2rem .8rem 3.6rem;
            border-bottom: 1px solid rgba(68, 138, 255, .2);
            background-color: rgba(68, 138, 255, .1);
            font-weight: 700;
        }

        .callout > .callout-title:before {
            position: absolute;
            left: 1.2rem;
            font-size: 1.5rem;
            color: rgba(68, 138, 255, .8);
            content: "info";
            font-family: "Material Icons";
            font-style: normal;
            font-variant: normal;
        }

        /* 不同类型的 callout */
        .callout.callout-note {
            border-left-color: #448aff;
        }
        .callout.callout-note > .callout-title {
            background-color: rgba(68, 138, 255, .1);
        }
        .callout.callout-note > .callout-title:before {
            color: #448aff;
            content: "info";
        }

        .callout.callout-tip {
            border-left-color: #00bfa5;
        }
        .callout.callout-tip > .callout-title {
            background-color: rgba(0, 191, 165, .1);
        }
        .callout.callout-tip > .callout-title:before {
            color: #00bfa5;
            content: "lightbulb";
        }

        .callout.callout-warning {
            border-left-color: #ff9100;
        }
        .callout.callout-warning > .callout-title {
            background-color: rgba(255, 145, 0, .1);
        }
        .callout.callout-warning > .callout-title:before {
            color: #ff9100;
            content: "warning";
        }

        .callout.callout-danger {
            border-left-color: #ff5252;
        }
        .callout.callout-danger > .callout-title {
            background-color: rgba(255, 82, 82, .1);
        }
        .callout.callout-danger > .callout-title:before {
            color: #ff5252;
            content: "error";
        }
        
        pre {
            background-color: #f6f8fa;
            border-radius: 3px;
            padding: 16px;
            overflow: auto;
        }
        
        code {
            font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
            background-color: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 3px;
        }
        
        pre code {
            background-color: transparent;
            padding: 0;
        }
    </style>
    <!-- Material Icons 字体 -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <h1>Callout 语法测试</h1>
    
    <p>这是普通文本段落。</p>
    
    <!-- Callout: Note -->
    <div class="callout callout-note">
        <div class="callout-title">笔记标题</div>
        <p>这是一个笔记内容，使用 Callout 语法。<br>
        可以包含多行内容。</p>
    </div>
    
    <!-- Callout: Tip -->
    <div class="callout callout-tip">
        <div class="callout-title">提示标题</div>
        <p>这是一个提示信息。</p>
        <ul>
            <li>可以包含列表</li>
            <li>多行内容</li>
        </ul>
    </div>
    
    <!-- Callout: Warning -->
    <div class="callout callout-warning">
        <div class="callout-title">警告标题</div>
        <p>这是一个警告信息。</p>
    </div>
    
    <!-- Callout: Danger -->
    <div class="callout callout-danger">
        <div class="callout-title">危险操作</div>
        <p>这是一个危险信息。</p>
    </div>
    
    <p>普通文本继续。</p>
    
    <blockquote>
        <p>这是普通的引用块，没有使用 Callout 语法。</p>
    </blockquote>
    
    <!-- Callout: Info without title -->
    <div class="callout callout-note">
        <div class="callout-title">INFO</div>
        <p>这是没有标题的 Callout，将会使用默认标题。</p>
    </div>
    
    <!-- Callout: Example with code -->
    <div class="callout callout-tip">
        <div class="callout-title">EXAMPLE</div>
        <pre><code>// 可以在 Callout 中包含代码块
function hello() {
  console.log("Hello, world!");
}</code></pre>
    </div>
</body>
</html>
